<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Illustrated avatar">
  <rect width="200" height="200" fill="#ffb224"/>
  <!-- shoulders / t-shirt -->
  <path d="M34 200c4-36 30-56 66-56s62 20 66 56" fill="#2f6f4f" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <path d="M84 146l16 18 16-18" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- neck -->
  <path d="M86 128v20h28v-20" fill="#c98b5b" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <!-- head -->
  <ellipse cx="100" cy="92" rx="40" ry="44" fill="#d9996a" stroke="#000" stroke-width="5"/>
  <!-- ears -->
  <ellipse cx="60" cy="96" rx="8" ry="11" fill="#d9996a" stroke="#000" stroke-width="5"/>
  <ellipse cx="140" cy="96" rx="8" ry="11" fill="#d9996a" stroke="#000" stroke-width="5"/>
  <!-- hair -->
  <path d="M58 88c-4-34 18-52 44-52 30 0 48 18 42 50-8-14-20-22-34-24 4 6 4 12 2 16-10-10-28-14-42-10-6 4-10 10-12 20z" fill="#1c1814" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="84" cy="98" r="5" fill="#000"/>
  <circle cx="116" cy="98" r="5" fill="#000"/>
  <!-- brows -->
  <path d="M75 86q9-6 18 0M107 86q9-6 18 0" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M86 116q14 12 28 0" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="74" cy="112" r="6" fill="#c2410c" opacity=".35"/>
  <circle cx="126" cy="112" r="6" fill="#c2410c" opacity=".35"/>
</svg>
